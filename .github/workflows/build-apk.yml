name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - run: npm install
      - run: |
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/logo.svg -o assets/icon-only.png
          cp assets/icon-only.png assets/splash.png
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#0B0E14' --splashBackgroundColor '#0B0E14' || true
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MHugo-Forex-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
